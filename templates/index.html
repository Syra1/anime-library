<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ma bibliothèque d'animés</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/global.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/index.css') }}"
    >


</head>


<body>

    <header>

        <h1>🎬 Ma bibliothèque d'animés</h1>

        <p>
            Retrouve tous les animés de ta collection.
        </p>

    </header>


    <main>

        <!-- Recherche d'un anime sur AniList -->
        <section class="add-anime">

            <h2>Ajouter un anime</h2>

            <input
                type="text"
                id="anime-search"
                placeholder="Rechercher un anime..."
            >

            <section id="search-results">
                <!-- Les résultats AniList apparaîtront ici -->
            </section>

        </section>


        <!-- Recherche dans ma bibliothèque -->
        <section class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Rechercher dans ma bibliothèque..."
            >

        </section>


        <!-- Liste de ma bibliothèque -->
        <section id="anime-list">

            <p>
                Chargement des animés...
            </p>

        </section>

    </main>


    <!-- ============================================================
         MODALE AJOUT D'UN ANIME
         ============================================================ -->

    <div id="add-modal" class="modal">

        <div class="modal-content">

            <h2 id="add-modal-title">
                Ajouter un anime
            </h2>

            <p>
                Combien de saisons possède cet anime ?
            </p>

            <input
                type="number"
                id="season-count"
                min="1"
                value="1"
            >

            <div class="modal-actions">

                <button id="cancel-add">
                    Annuler
                </button>

                <button id="confirm-add">
                    Ajouter
                </button>

            </div>

        </div>

    </div>


    <!-- ============================================================
         MODALE SUPPRESSION
         ============================================================ -->

    <div id="delete-modal" class="modal">

        <div class="modal-content">

            <h2>
                Supprimer cet anime ?
            </h2>

            <p>
                Cette action est irréversible.
            </p>

            <div class="modal-actions">

                <button id="cancel-delete">
                    Annuler
                </button>

                <button id="confirm-delete">
                    Supprimer
                </button>

            </div>

        </div>

    </div>


    <script src="/static/js/index.js"></script>

</body>

</html>
