<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ma bibliothèque d'animés</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>


<body>

    <header>

        <h1>🎬 Ma bibliothèque d'animés</h1>

        <p>
            Retrouve tous les animés de ta collection.
        </p>

    </header>


    <main>

        <section class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Rechercher un anime..."
            >

        </section>


        <section id="anime-list">

            <p>
                Chargement des animés...
            </p>

        </section>

    </main>


    <script src="/static/script.js"></script>

</body>

</html>
