<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>
            {% block title %}
                Bibliothèque
            {% endblock %}
        </title>
        {% block styles %}
        <link rel="stylesheet" href="/static/css/global.css">
        <link rel="stylesheet" href="/static/css/animations.css">
        {% endblock %}
    </head>
    <body>
        <div class="home-page">
            <header class="header-bar">
                <div class="site-title">
                    Ma Bibliothèque
                </div>
                <nav class="navbar-button">
                    <ul class="link_list">
                        <li><a href="/" title="Accueil">Accueil</a></li>
                        <li><a href="/anime/" title="Animés">Animés</a></li>
                        <li><a href="/film/" title="Films">Films</a></li>
                        <li><a href="/serie/" title="Séries">Séries</a></li>
                    </ul>
                </nav>
                <nav class="navbar-icons">
                    <ul class="link_icons">
                        <li><button type="button"> <img src="/static/icons/Search.svg" alt="Search"> </button></li>
                        <li><button type="button"> <img src="/static/icons/Menu.svg" alt="Menu"> </button></li>
                        <li><button type="button"> <img src="/static/icons/Close.svg" alt="Close"> </button></li>
                    </ul>
                </nav>
            </header>
            <main>
                {% block content %}
                {% endblock %}
            </main>
            {% block scripts %}
            {% endblock %}
        </div>
    </body>
</html>
