<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>
            {% block title %}
                Anime Library
            {% endblock %}
        </title>
        <link rel="icon" href="/static/icons/clapper.svg" />
        <link rel="stylesheet" href="/static/css/global.css" />
        <link rel="stylesheet" href="/static/css/animations.css" />
        {% block styles %}
        {% endblock %}
    </head>
    <body>
        
        <header class="main-header">

    <div class="library-menu">

        <a href="/" class="back-home-button">
            <img src="/static/icons/library.svg" alt="Accueil" />
            Accueil
        </a>

        <div class="library-submenu">

            <a href="/anime/" class="library-submenu-button">
                Animés
            </a>

            <span class="library-submenu-button disabled">
                Films
            </span>

            <span class="library-submenu-button disabled">
                Séries
            </span>

        </div>

    </div>

    <div class="site-title">
        <img src="/static/icons/clapper.svg" alt="Clapper" />
        <span>
            Ma Bibliothèque
        </span>
    </div>

</header>

        <main>
            {% block content %}
            {% endblock %}
        </main>
        {% block scripts %}
        {% endblock %}
    </body>
</html>
