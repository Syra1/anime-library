{% extends "base.html" %}


{% block content %}

<img 
    src="{{ anime.image }}"
    alt="{{ anime.titre }}"
    class="anime-detail-image"
>


<h1>
    {{ anime.titre }}
</h1>


<p class="original-title">
    {{ anime.titre_original }}
</p>


<div class="seasons">

{% for saison in anime.saisons %}

<button
    class="
        season-button
        {% if saison.vue %}
            watched
        {% else %}
            unwatched
        {% endif %}
    "
    data-anime-id="{{ anime.id }}"
    data-season-id="{{ saison.id }}"
    data-season-number="{{ saison.numero }}"
>
    Saison {{ saison.numero }}
</button>

{% endfor %}

</div>


<button
    class="delete-anime-button"
    data-anime-id="{{ anime.id }}"
>
    🗑️ Supprimer
</button>


{% endblock %}



{% block scripts %}

<script src="/static/js/anime.js"></script>

{% endblock %}
