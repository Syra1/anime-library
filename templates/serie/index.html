{% extends "base.html" %}

{% block title %}
    Séries
{% endblock %}

{% block styles %}
    {{ super() }}
    <link rel="stylesheet" href="/static/css/serie/index.css">
{% endblock %}

{% block content %}
<!-- Recherche d'un serie sur TMDB -->
<section class="add-serie">
    <div class="search-input">
        <span class="search-icon">
            <img src="/static/icons/search.svg" alt="" > 
        </span>
        <input type="text" id="serie-search" placeholder="Rechercher un serie...">
    </div>
    <section id="search-results">
        <!-- Les résultats TMDB apparaîtront ici -->
    </section>
</section>

<!-- Recherche dans ma bibliothèque -->
<section class="toolbar">
    <div class="search-input">
        <span class="search-icon">
            <img src="/static/icons/search.svg" alt="" >
        </span>
        <input type="text" id="search" placeholder="Rechercher dans ma bibliothèque...">
    </div>
</section>


<!-- Liste de ma bibliothèque -->
<section id="serie-list">
    <p>
        Chargement des series...
    </p>
</section>


{% endblock %}

{% block scripts %}
<script src="/static/js/serie/index.js"></script>
{% endblock %}
