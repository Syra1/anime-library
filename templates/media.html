{% macro media_index(
    media_type,
    search_id,
    search_placeholder,
    list_id,
    loading_text,
    a_voir
) %}

{% block styles %}
    <link rel="stylesheet" href="/static/css/media.css">
{% endblock %}

<div class="page-{{ media_type }}-index">
    <div class="watch-container">
        <button type="button" id="watch-button-{{ media_type }}" class="watch-button">
            A voir
        </button>

        {% if a_voir %}
        <section id="watch-list-{{ media_type }}" class="watch-list">
            {% for media in a_voir %}
                <div class="watch-item">
                    <strong>{{ media }}</strong>
                </div>
            {% endfor %}
        </section>
        {% endif %}
    </div>

    <section class="add-media">
        <div class="search-input">
            <span class="search-icon">
                <img src="/static/icons/search.svg" alt="">
            </span>
            <input type="text" id="{{ search_id }}" class="media-search" placeholder="{{ search_placeholder }}">
        </div>
        <section id="search-results" class="media-results">
            <!-- Les résultats TMDB apparaîtront ici -->
        </section>
    </section>

    <section class="toolbar">
        <div class="search-input">
            <span class="search-icon">
                <img src="/static/icons/search.svg" alt="">
            </span>
            <input type="text" id="search" class="API-search" placeholder="Rechercher dans ma bibliothèque...">
        </div>
    </section>

    <section id="{{ list_id }}" class="media-list">
        <p>
            {{ loading_text }}
        </p>
    </section>
</div>

{% endmacro %}
